[project]
name = "privatube"
version = "0.1.0"
description = "Share YouTube videos privately with people who can't watch them on YouTube: a self-hosted, invite-only video library."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "yt-dlp[default]",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privatube*"]

[tool.setuptools.package-data]
privatube = ["templates/*.html", "templates/admin/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
