{% extends "base.html" %}
{% block title %}{{ _('Sign in') }} · PrivaTube{% endblock %}
{% block main %}
<div class="auth">
  <p class="tagline">{{ _('Your videos. Your server. Yours to keep.') }}</p>
  <h1>{{ _('Sign in') }}</h1>
  {% if error %}<p class="error">{{ _(error) }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ _('Username') }} <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>{{ _('Password') }} <input name="password" type="password" autocomplete="current-password" required></label>
    <button>{{ _('Sign in') }}</button>
  </form>
  <p class="muted"><a href="/code">{{ _('I have an access code') }}</a></p>
</div>
{% endblock %}
